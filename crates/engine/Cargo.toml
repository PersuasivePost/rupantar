[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
calamine = "0.37"
csv = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rust_xlsxwriter = "0.100"
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
# Fixture builders: `cfb` for .xls containers, `zip` for .ods packages (stored entries only;
# deflate for reading rust_xlsxwriter output comes from calamine's own `zip`).
cfb = "0.15"
serde_json = "1.0.154"
tempfile = "3"
zip = { version = "9", default-features = false }
