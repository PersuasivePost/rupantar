name: Feature request
description: Suggest a new conversion or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The file type(s) involved and what you want out of them.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Rupantar to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
      description: Other tools or workarounds, and why they fall short.
