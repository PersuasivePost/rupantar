[package]
name = "rupantar"
version = "0.1.0"
edition = "2021"

[lib]
name = "rupantar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: needed for transparent windows on macOS (rules out Mac App Store distribution).
# image-png: lets the tray reuse the bundle icon.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Image previews are sent to the crop dialog as data: URLs.
base64 = "0.22"
engine = { path = "../crates/engine" }
placement = { path = "../crates/placement" }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
