[package]
name = "rupantar"
version = "0.1.0"
edition = "2021"

[lib]
name = "rupantar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
engine = { path = "../crates/engine" }
